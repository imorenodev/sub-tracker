<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Subs">
<meta name="theme-color" content="#1d6b45">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Subs</title>
<style>
:root{
  --bg:#eef3f0; --surface:#ffffff; --ink:#14201a; --muted:#5d6b63; --line:#d6e0da;
  --pitch:#1d6b45; --pitch-2:#e1efe7;
  --go:#1d6b45; --stop:#d23c2a;
  --under:#137a4a; --under-bg:#dff2e7;
  --over:#c2361f; --over-bg:#fbe4df;
  --even:#6b7770;
  --board:#15181a; --board-ink:#f4f6f5; --led-out:#ff5a3c; --led-in:#6ee79a;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1512; --surface:#18211c; --ink:#e8efeb; --muted:#9aa9a0; --line:#2a3630;
    --pitch:#3fa872; --pitch-2:#1d3328;
    --go:#2f9b63; --stop:#e0513d;
    --under:#5fd394; --under-bg:#173526;
    --over:#ff8a73; --over-bg:#3a1f1a;
    --even:#8d9a93;
    --board:#050606;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pitch);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 24px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px}
.topline{display:flex;gap:8px;align-items:center}
.tabs{flex:1;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tab{border:0;background:transparent;border-radius:10px;padding:10px 0;font-weight:700;font-size:18px;position:relative}
.tab[aria-selected="true"]{background:var(--pitch);color:#fff}
.tab .live{position:absolute;top:8px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--led-out);display:none}
.tab.running .live{display:block}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;height:50px;padding:0 14px;font-weight:600;font-size:15px}

.controls{display:flex;gap:8px;margin-top:8px;align-items:stretch}
.stopall{flex:1;border:0;border-radius:14px;background:var(--stop);color:#fff;font-weight:800;font-size:20px;padding:14px 0;letter-spacing:.02em}
.stopall:disabled{opacity:.35}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px;min-width:82px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.stat b{font-size:20px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

/* substitution board */
.board{margin-top:10px;background:var(--board);color:var(--board-ink);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;min-height:64px}
.board .txt{flex:1;min-width:0}
.board .t{font-size:13px;color:#a9b3ae}
.board .b{font-size:17px;font-weight:700;margin-top:2px;line-height:1.3}
.swap{display:flex;flex-direction:column;gap:4px;font-size:18px;font-weight:700}
.swap .out{color:var(--led-out)} .swap .in{color:var(--led-in)}
.swap .arr{display:inline-block;width:1.2em}
.board button{border:0;border-radius:12px;background:var(--led-in);color:#062012;font-weight:800;font-size:16px;padding:12px 14px;white-space:nowrap}
.board.warn button{background:var(--led-out);color:#fff}
.board.quiet .b{font-weight:600}

/* player rows */
.list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:1fr auto 104px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--even);border-radius:14px;padding:8px 8px 8px 12px;min-height:66px}
.row.under{border-left-color:var(--under)}
.row.over{border-left-color:var(--over)}
.row.on{background:var(--pitch-2);border-color:var(--pitch);border-left-width:6px}
.row.under.on{border-left-color:var(--under)} .row.over.on{border-left-color:var(--over)}
.name{font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;margin-top:2px;color:var(--even);font-weight:600}
.row.under .meta{color:var(--under)} .row.over .meta{color:var(--over)}
.time{font-size:22px;font-weight:700;text-align:right}
.row.on .time{color:var(--pitch)}
.tog{border:0;border-radius:12px;height:50px;font-weight:800;font-size:17px;background:var(--go);color:#fff}
.row.on .tog{background:var(--stop)}
.pip{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pitch);margin-right:6px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pip{animation:none}}
.absent{opacity:.5}
.absent .tog{background:var(--line);color:var(--muted)}

.footer{display:flex;gap:8px;margin-top:14px}
.footer button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 0;font-weight:700;font-size:16px}
.footer button:disabled{opacity:.4}
.legend{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.5;text-align:center}
.legend i{font-style:normal;font-weight:700}
.legend .u{color:var(--under)} .legend .o{color:var(--over)}

/* roster editor */
#roster{display:none}
body.editing #game{display:none}
body.editing #roster{display:block}
h2{font-size:22px;margin:16px 0 8px}
.ed{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-bottom:6px}
.ed input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-size:17px}
.here{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px;height:48px}
.here input{width:22px;height:22px;accent-color:var(--pitch)}
.del{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:48px;height:48px;font-size:18px;color:var(--stop)}
.btnrow{display:flex;gap:8px;margin:8px 0}
.btnrow button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 0;font-weight:700}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.setting label{font-weight:600}
.setting small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.setting select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;font-size:16px}
.primary{width:100%;border:0;border-radius:14px;background:var(--pitch);color:#fff;font-weight:800;font-size:18px;padding:16px 0;margin-top:14px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="topline">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="iconbtn" id="editBtn">Roster</button>
    </div>
    <div class="controls" id="gameControls">
      <button class="stopall" id="stopAll">STOP ALL</button>
      <div class="stat"><b class="num" id="onCount">0/5</b><span>on field</span></div>
      <div class="stat"><b class="num" id="avg">0:00</b><span>average</span></div>
    </div>
  </header>

  <main id="game">
    <div class="board quiet" id="board"></div>
    <div class="list" id="list"></div>
    <div class="footer">
      <button id="undoBtn" disabled>Undo last tap</button>
      <button id="newGame">New game</button>
    </div>
    <p class="legend"><i class="u">Green</i> has played less than average, <i class="o">red</i> has played more. Gray is within 30 seconds of average.</p>
  </main>

  <section id="roster">
    <h2 id="rosterTitle">Roster</h2>
    <div id="edList"></div>
    <div class="btnrow">
      <button id="addP">Add player</button>
      <button id="allHere">Mark all here</button>
    </div>
    <h2>Game settings</h2>
    <div class="setting">
      <label for="sOn">Players on the field</label>
      <select id="sOn"></select>
    </div>
    <div class="setting">
      <label for="sStint">Minimum shift<small>Before a player is suggested to come off</small></label>
      <select id="sStint"></select>
    </div>
    <div class="setting">
      <label for="sGap">Suggest a sub when the gap reaches<small>Difference in total time played</small></label>
      <select id="sGap"></select>
    </div>
    <button class="primary" id="doneBtn">Done</button>
  </section>
</div>

<script>
(function(){
const KEY='subtracker-v1', TEAMS=['5U','6U'], BAND=30000;
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(ms){ms=Math.max(0,Math.round(ms/1000));const m=Math.floor(ms/60),s=ms%60;return m+':'+String(s).padStart(2,'0');}

function freshGame(){return {times:{},lastLineup:[]};}
function defaultTeam(){
  return {players:Array.from({length:10},(_,i)=>({id:uid(),name:'Player '+(i+1),present:true})),
          settings:{onField:5,minStint:180,gap:90},game:freshGame()};
}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!S||!S.teams)S={active:'5U',teams:{}};
TEAMS.forEach(t=>{if(!S.teams[t])S.teams[t]=defaultTeam();});
if(!S.teams[S.active])S.active='5U';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
save();

const T=()=>S.teams[S.active];
const present=()=>T().players.filter(p=>p.present);
function rec(id,team){const g=(team||T()).game;if(!g.times[id])g.times[id]={total:0,startedAt:null,benchSince:null};return g.times[id];}
function played(id,now){const r=rec(id);return r.total+(r.startedAt?now-r.startedAt:0);}
const isOn=id=>!!rec(id).startedAt;
function startP(id,now){const r=rec(id);if(!r.startedAt){r.startedAt=now;r.benchSince=null;}}
function stopP(id,now){const r=rec(id);if(r.startedAt){r.total+=now-r.startedAt;r.startedAt=null;r.benchSince=now;}}

let undo=null;
function act(fn){
  undo={team:S.active,game:JSON.stringify(T().game)};
  fn(Date.now());save();render();
}

/* ---------- suggestion engine ---------- */
function names(ps){return ps.map(p=>esc(p.name)).join(', ');}
function suggest(now){
  const t=T(),st=t.settings,pres=present();
  if(!pres.length)return {cls:'quiet',title:'No players marked here',body:'Open Roster to set today\u2019s attendance.'};
  const on=pres.filter(p=>isOn(p.id)),bench=pres.filter(p=>!isOn(p.id));
  const least=(a,b)=>(played(a.id,now)-played(b.id,now))||((rec(a.id).benchSince||0)-(rec(b.id).benchSince||0));
  const most=(a,b)=>played(b.id,now)-played(a.id,now);
  const anyTime=pres.some(p=>played(p.id,now)>0);

  if(!on.length){
    if(!anyTime){
      const s=[...bench].sort(least).slice(0,st.onField);
      return {cls:'',title:'Suggested starters',body:names(s),btn:'Start these',run:n=>s.forEach(p=>startP(p.id,n))};
    }
    const lu=t.game.lastLineup.filter(id=>pres.some(p=>p.id===id));
    if(lu.length)return {cls:'',title:'All timers stopped',body:'Resume with the same '+lu.length+' players?',btn:'Resume',run:n=>lu.forEach(id=>startP(id,n))};
  }
  if(on.length<st.onField&&bench.length){
    const need=st.onField-on.length,ins=[...bench].sort(least).slice(0,need);
    return {cls:'',title:need===1?'Field needs 1 more player':'Field needs '+need+' more players',body:'Put in '+names(ins),btn:'Put in',run:n=>ins.forEach(p=>startP(p.id,n))};
  }
  if(on.length>st.onField){
    const outs=[...on].sort(most).slice(0,on.length-st.onField);
    return {cls:'warn',title:on.length+' timers running (field is '+st.onField+')',body:'Take out '+names(outs),btn:'Take out',run:n=>outs.forEach(p=>stopP(p.id,n))};
  }
  if(!bench.length)return {cls:'quiet',title:'No subs on the bench',body:'Everyone here is playing.'};

  const inP=[...bench].sort(least)[0];
  const minMs=st.minStint*1000;
  const elig=on.filter(p=>now-rec(p.id).startedAt>=minMs);
  if(!elig.length){
    const wait=Math.min(...on.map(p=>minMs-(now-rec(p.id).startedAt)));
    return {cls:'quiet',title:'Next sub check in '+fmt(wait),body:'Next in: '+esc(inP.name)};
  }
  const outP=[...elig].sort(most)[0];
  if(played(outP.id,now)-played(inP.id,now)>=st.gap*1000){
    return {cls:'',swap:{out:outP,in:inP},btn:'Sub now',run:n=>{stopP(outP.id,n);startP(inP.id,n);}};
  }
  return {cls:'quiet',title:'Playing time is balanced',body:'Next in: '+esc(inP.name)};
}

/* ---------- rendering ---------- */
let currentSug=null,boardSig='';
function renderBoard(now){
  const s=suggest(now);currentSug=s;
  let html;
  if(s.swap){
    html=`<div class="txt"><div class="t">Suggested sub</div><div class="swap">
      <div class="out"><span class="arr">\u2193</span>${esc(s.swap.out.name)}</div>
      <div class="in"><span class="arr">\u2191</span>${esc(s.swap.in.name)}</div></div></div>`;
  }else{
    html=`<div class="txt"><div class="t">${s.title}</div><div class="b">${s.body}</div></div>`;
  }
  if(s.btn)html+=`<button id="sugBtn">${s.btn}</button>`;
  const sig=s.cls+'|'+html;
  if(sig!==boardSig){boardSig=sig;const b=$('board');b.className='board '+s.cls;b.innerHTML=html;}
}

function renderTabs(){
  $('tabs').innerHTML=TEAMS.map(t=>{
    const running=S.teams[t].players.some(p=>(S.teams[t].game.times[p.id]||{}).startedAt);
    return `<button class="tab${running?' running':''}" role="tab" aria-selected="${t===S.active}" data-team="${t}">${t}<span class="live"></span></button>`;
  }).join('');
}

function renderList(){
  const list=$('list');
  const pres=present(),abs=T().players.filter(p=>!p.present);
  list.innerHTML=[...pres,...abs].map(p=>{
    const on=p.present&&isOn(p.id);
    return `<div class="row${on?' on':''}${p.present?'':' absent'}" data-id="${p.id}">
      <div><div class="name">${on?'<span class="pip"></span>':''}${esc(p.name)}</div><div class="meta"></div></div>
      <div class="time num"></div>
      <button class="tog"${p.present?'':' disabled'}>${!p.present?'Not here':on?'STOP':'START'}</button>
    </div>`;
  }).join('');
}

function tick(){
  const now=Date.now(),pres=present(),st=T().settings;
  const avg=pres.length?pres.reduce((s,p)=>s+played(p.id,now),0)/pres.length:0;
  const onN=pres.filter(p=>isOn(p.id)).length;
  $('avg').textContent=fmt(avg);
  $('onCount').textContent=onN+'/'+st.onField;
  $('stopAll').disabled=!T().players.some(p=>isOn(p.id));
  document.querySelectorAll('#list .row').forEach(row=>{
    const p=T().players.find(x=>x.id===row.dataset.id);if(!p)return;
    const ms=played(p.id,now),d=ms-avg;
    row.querySelector('.time').textContent=fmt(ms);
    const meta=row.querySelector('.meta');
    row.classList.remove('under','over');
    if(!p.present){meta.textContent='Not counted today';return;}
    if(avg===0&&ms===0){meta.textContent='Not played yet';return;}
    if(d<=-BAND){row.classList.add('under');meta.textContent='\u25BC '+fmt(-d)+' under average';}
    else if(d>=BAND){row.classList.add('over');meta.textContent='\u25B2 '+fmt(d)+' over average';}
    else meta.textContent='About even';
  });
  renderBoard(now);
  const anyRunning=TEAMS.some(t=>S.teams[t].players.some(p=>(S.teams[t].game.times[p.id]||{}).startedAt));
  wake(anyRunning);
}

function render(){
  renderTabs();renderList();boardSig='';tick();
  $('undoBtn').disabled=!(undo&&undo.team===S.active);
}

/* ---------- events ---------- */
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  S.active=b.dataset.team;save();
  if(document.body.classList.contains('editing'))renderRoster();
  render();
});
$('list').addEventListener('click',e=>{
  const b=e.target.closest('.tog');if(!b||b.disabled)return;
  const id=b.closest('.row').dataset.id;
  act(n=>isOn(id)?stopP(id,n):startP(id,n));
});
$('board').addEventListener('click',e=>{
  if(e.target.id==='sugBtn'&&currentSug&&currentSug.run){const r=currentSug.run;act(r);}
});
$('stopAll').addEventListener('click',()=>act(n=>{
  const on=T().players.filter(p=>isOn(p.id)).map(p=>p.id);
  if(on.length)T().game.lastLineup=on;
  on.forEach(id=>stopP(id,n));
}));
$('undoBtn').addEventListener('click',()=>{
  if(!undo||undo.team!==S.active)return;
  T().game=JSON.parse(undo.game);undo=null;save();render();
});
$('newGame').addEventListener('click',()=>{
  if(!confirm('Start a new '+S.active+' game? This clears today\u2019s playing times. Your roster stays.'))return;
  undo={team:S.active,game:JSON.stringify(T().game)};
  T().game=freshGame();save();render();
});

/* ---------- roster editor ---------- */
function opts(sel,items,val){sel.innerHTML=items.map(([v,l])=>`<option value="${v}"${v==val?' selected':''}>${l}</option>`).join('');}
function renderRoster(){
  const t=T();
  $('rosterTitle').textContent=S.active+' roster';
  $('edList').innerHTML=t.players.map(p=>`<div class="ed" data-id="${p.id}">
    <input type="text" value="${esc(p.name)}" aria-label="Player name" autocomplete="off" autocapitalize="words">
    <label class="here"><input type="checkbox"${p.present?' checked':''}>Here</label>
    <button class="del" aria-label="Remove ${esc(p.name)}">\u2715</button></div>`).join('');
  opts($('sOn'),[3,4,5,6,7,8,9,11].map(n=>[n,n+' v '+n]),t.settings.onField);
  opts($('sStint'),[60,120,180,240,300,360,480].map(s=>[s,(s/60)+' min']),t.settings.minStint);
  opts($('sGap'),[30,60,90,120,180,240].map(s=>[s,fmt(s*1000)]),t.settings.gap);
}
$('editBtn').addEventListener('click',()=>{
  const ed=document.body.classList.toggle('editing');
  $('editBtn').textContent=ed?'Game':'Roster';
  $('gameControls').style.display=ed?'none':'';
  if(ed)renderRoster();else render();
});
$('doneBtn').addEventListener('click',()=>$('editBtn').click());
$('edList').addEventListener('input',e=>{
  const row=e.target.closest('.ed');if(!row)return;
  const p=T().players.find(x=>x.id===row.dataset.id);
  if(e.target.type==='text'){p.name=e.target.value.trim()||'Player';}
  save();
});
$('edList').addEventListener('change',e=>{
  const row=e.target.closest('.ed');if(!row||e.target.type!=='checkbox')return;
  const p=T().players.find(x=>x.id===row.dataset.id);
  p.present=e.target.checked;
  if(!p.present)stopP(p.id,Date.now());
  save();
});
$('edList').addEventListener('click',e=>{
  const b=e.target.closest('.del');if(!b)return;
  const id=b.closest('.ed').dataset.id,t=T(),p=t.players.find(x=>x.id===id);
  if(!confirm('Remove '+p.name+' from the '+S.active+' roster?'))return;
  t.players=t.players.filter(x=>x.id!==id);delete t.game.times[id];save();renderRoster();
});
$('addP').addEventListener('click',()=>{
  const t=T();t.players.push({id:uid(),name:'Player '+(t.players.length+1),present:true});
  save();renderRoster();
  const inputs=$('edList').querySelectorAll('input[type=text]');const last=inputs[inputs.length-1];
  last.focus();last.select();
});
$('allHere').addEventListener('click',()=>{T().players.forEach(p=>p.present=true);save();renderRoster();});
[['sOn','onField'],['sStint','minStint'],['sGap','gap']].forEach(([id,k])=>{
  $(id).addEventListener('change',e=>{T().settings[k]=+e.target.value;save();});
});

/* ---------- keep screen awake while timers run ---------- */
let lock=null,pending=false;
async function wake(want){
  if(!('wakeLock' in navigator))return;
  try{
    if(want&&!lock&&!pending&&document.visibilityState==='visible'){
      pending=true;lock=await navigator.wakeLock.request('screen');
      lock.addEventListener('release',()=>{lock=null;});
    }else if(!want&&lock){await lock.release();lock=null;}
  }catch(e){}finally{pending=false;}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tick();});

render();
setInterval(()=>{if(!document.body.classList.contains('editing'))tick();},1000);

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
